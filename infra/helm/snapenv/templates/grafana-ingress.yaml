# grafana-ingress.yaml — Route grafana.localhost to the Grafana service.
#
# The Grafana service runs in the monitoring namespace (installed by
# kube-prometheus-stack). This Ingress creates a route from outside
# the cluster to that service, so it can be access with grafana.localhost

{{- if .Values.monitoring.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: monitoring
  labels:
    app: {{ .Release.Name }}
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
{{- end }}
