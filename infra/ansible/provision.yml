# provision.yml — Configure the OCI ARM server after `terraform apply`.
#
# Run via: make provision
# Or manually:
#   SERVER_IP=$(cd infra/terraform && terraform output -raw server_public_ip)
#   ansible-playbook infra/ansible/provision.yml \
#     -i "$SERVER_IP," \
#     --extra-vars "server_ip=$SERVER_IP"
#
# What this playbook does (in order):
#   1. System — update packages, install prerequisites
#   2. Docker — install and enable Docker engine
#   3. k3s — install lightweight Kubernetes (replaces k3d for real servers)
#   4. Helm — install the Helm package manager
#   5. Ingress — deploy nginx ingress controller
#   6. Monitoring — deploy kube-prometheus-stack (Prometheus + Grafana)
#   7. ArgoCD — deploy ArgoCD with HTTP ingress (no port-forward needed)

- name: Configure SnapEnv server
  hosts: all
  remote_user: opc
  become: true

  vars:
    # nip.io maps <anything>.<ip>.nip.io → <ip>, so no DNS setup is needed.
    domain_suffix: "{{ server_ip }}.nip.io"
    app_host:     "snapenv.{{ domain_suffix }}"
    grafana_host: "grafana.{{ domain_suffix }}"
    argocd_host:  "argocd.{{ domain_suffix }}"

  tasks:

    # ── 1. System ──────────────────────────────────────────────────
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.dnf:
        name:
          - git
          - curl
          - tar
          - firewalld
        state: present

    # firewalld blocks k3s pod networking by default on Oracle Linux.
    # Disabling it is acceptable here because OCI Security Lists already
    # act as the network-level firewall (ports 22/80/443/6443 are controlled there).
    - name: Disable firewalld (OCI Security List is the network firewall)
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false

    # ── 2. Docker ──────────────────────────────────────────────────
    - name: Add Docker repository
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add opc user to docker group
      ansible.builtin.user:
        name: opc
        groups: docker
        append: true

    # ── 3. k3s ─────────────────────────────────────────────────────
    # k3s is a lightweight Kubernetes distribution for real servers.
    # --disable=traefik: we use nginx ingress instead of traefik.
    # --write-kubeconfig-mode=644: lets the opc user (non-root) use kubectl.
    - name: Install k3s
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode=644"
          sh -
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready nodes --all --timeout=120s
      retries: 5
      delay: 10
      register: k3s_ready
      until: k3s_ready.rc == 0

    - name: Copy kubeconfig to opc home directory
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/opc/.kube/config
        remote_src: true
        owner: opc
        group: opc
        mode: "0600"

    # Replace 127.0.0.1 with the public IP so the kubeconfig works from your laptop.
    - name: Set server IP in kubeconfig
      ansible.builtin.replace:
        path: /home/opc/.kube/config
        regexp: "127\\.0\\.0\\.1"
        replace: "{{ server_ip }}"

    # ── 4. Helm ────────────────────────────────────────────────────
    - name: Install Helm
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm

    - name: Add ingress-nginx Helm repo
      ansible.builtin.command:
        cmd: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Add prometheus-community Helm repo
      ansible.builtin.command:
        cmd: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Add ArgoCD Helm repo
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Update Helm repos
      ansible.builtin.command:
        cmd: helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    # ── 5. Nginx Ingress ───────────────────────────────────────────
    - name: Install nginx ingress controller
      ansible.builtin.command:
        cmd: >
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
          --namespace ingress-nginx
          --create-namespace
          --set controller.publishService.enabled=true
          --wait --timeout 120s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    # ── 6. Monitoring (Prometheus + Grafana) ───────────────────────
    - name: Install kube-prometheus-stack
      ansible.builtin.command:
        cmd: >
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
          --namespace monitoring
          --create-namespace
          --set grafana.adminPassword=admin
          --set grafana.sidecar.dashboards.enabled=true
          --set grafana.sidecar.dashboards.searchNamespace=ALL
          --set grafana.ingress.enabled=true
          --set grafana.ingress.ingressClassName=nginx
          --set "grafana.ingress.hosts[0]={{ grafana_host }}"
          --wait --timeout 300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    # ── 7. ArgoCD ──────────────────────────────────────────────────
    - name: Create argocd namespace
      ansible.builtin.command:
        cmd: k3s kubectl create namespace argocd
      register: ns_result
      failed_when: ns_result.rc != 0 and "already exists" not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: Install ArgoCD
      ansible.builtin.command:
        cmd: >
          helm upgrade --install argocd argo/argo-cd
          --namespace argocd
          --set server.extraArgs[0]=--insecure
          --set "server.ingress.enabled=true"
          --set server.ingress.ingressClassName=nginx
          --set "server.ingress.hosts[0]={{ argocd_host }}"
          --wait --timeout 180s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    # ── Done ───────────────────────────────────────────────────────
    - name: Print access information
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - "  SnapEnv server is ready!"
          - "════════════════════════════════════════════"
          - ""
          - "  App:     http://{{ app_host }}"
          - "  Grafana: http://{{ grafana_host }}  (admin / admin)"
          - "  ArgoCD:  http://{{ argocd_host }}"
          - ""
          - "  Fetch ArgoCD password:"
          - "  kubectl -n argocd get secret argocd-initial-admin-secret \\"
          - "    -o jsonpath='{.data.password}' | base64 -d"
          - ""
          - "  Fetch remote kubeconfig:"
          - "  scp opc@{{ server_ip }}:~/.kube/config ~/.kube/snapenv-remote.yaml"
